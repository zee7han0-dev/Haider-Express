<html lang="en">
  <head>

      src="https://www.googletagmanager.com/gtag/js?id=G-G5SVQTCWM4"
    ></script>

      gtag("config", "G-G5SVQTCWM4");

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Haider Express</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div
      class="bg-slate-900 text-white text-xs font-semibold py-2 px-4 flex flex-col sm:flex-row justify-between items-center gap-2"
    >
      <div class="flex items-center gap-2">
        <span
          class="bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full animate-pulse"
          >NEW ARRIVALS</span
        >
        <span>Check out our newly arrived Premium Backpacks!</span>
      </div>
      <p>🚀 Free Shipping on Orders over Rs.5000 across Pakistan!</p>
    </div>

    <header class="bg-[#2bc4c3] text-black sticky top-0 z-50 shadow-md">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between"
      >
        <a
          href="index.html"
          class="text-2xl font-black tracking-wider flex items-center gap-1"
        >
          HAIDER<span>EXPRESS</span>
        </a>
        <nav class="hidden md:flex space-x-6 font-bold text-sm">
          <a
            href="index.html"
            class="hover:bg-white/10 px-3 py-1.5 rounded-lg transition"
            >Home</a
          >
          <a
            href="cart.html"
            class="hover:bg-white/10 px-3 py-1.5 rounded-lg transition"
            >Cart</a
          >
          <a
            href="orders.html"
            class="hover:bg-white/10 px-3 py-1.5 rounded-lg transition"
            >Orders</a
          >
          <a
            href="about.html"
            class="hover:bg-white/10 px-3 py-1.5 rounded-lg transition"
            >About Us</a
          >
          <a
            href="contact.html"
            class="hover:bg-white/10 px-3 py-1.5 rounded-lg transition"
            >Contact Us</a
          >
        </nav>

        <div class="flex items-center space-x-4">
          <a href="cart.html">
            <button
              class="bg-amber-400 text-slate-900 font-bold px-4 py-2 cursor-pointer rounded-xl flex items-center gap-2 hover:bg-amber-300 shadow-sm transition"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
                class="w-5 h-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
                />
              </svg>
              <span
                class="bg-slate-900 text-white rounded-full text-xs px-2 py-0.5 font-black"
                >0</span
              >
            </button>
          </a>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div
        id="details-container"
        class="bg-white rounded-3xl border border-slate-100 p-6 md:p-12 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-12 items-start"
      >
        <div class="text-center py-12 col-span-full">
          <p class="text-slate-400 animate-pulse text-sm font-semibold">
            Loading product profile parameters...
          </p>
        </div>
      </div>
    </main>

    <footer
      class="bg-slate-950 text-slate-400 py-8 border-t border-slate-900 text-center text-sm"
    >
      <p>&copy; 2026 HAIDER EXPRESS Collection. All rights reserved.</p>
    </footer>

    <script src="data/products.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id");
        const container = document.getElementById("details-container");

        if (typeof PRODUCTS === "undefined") {
          console.error(
            "PRODUCTS array is not loaded. Check your script tags.",
          );
          return;
        }

        const product = PRODUCTS.find((p) => p.id === productId);

        if (!product) {
          container.innerHTML = `
            <div class="col-span-full text-center py-16">
              <span class="text-5xl block mb-4">⚠️</span>
              <h3 class="text-lg font-black text-slate-900">Product Profile Not Found</h3>
              <p class="text-slate-400 text-xs mt-1 mb-6">The requested index code entry is missing or invalid.</p>
              <a href="index.html" class="bg-[#2bc4c3] text-white font-bold text-xs px-6 py-3 rounded-xl shadow-sm hover:bg-[#229e9d] transition">Back to Catalog</a>
            </div>
          `;
          return;
        }

        const imageList = Array.isArray(product.images)
          ? product.images
          : product.image
            ? [product.image]
            : ["/data/img/placeholder.jpg"];
        const primaryImage = imageList[0];

        let thumbnailsHTML = "";
        imageList.forEach((imgUrl, index) => {
          thumbnailsHTML += `
            <button data-img-target="${imgUrl}" class="thumb-nav-btn w-20 h-20 bg-slate-50 border border-slate-200 rounded-xl overflow-hidden focus:outline-none focus:ring-2 focus:ring-[#2bc4c3] active:scale-95 transition flex-shrink-0">
              <img src="${imgUrl}" alt="Thumbnail ${index}" class="w-full h-full object-cover" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'%23cbd5e1\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z\'/></svg>'" />
            </button>
          `;
        });

        container.innerHTML = `
          <div class="space-y-4">
            <div class="bg-slate-50 border border-slate-100 rounded-2xl overflow-hidden h-96 flex items-center justify-center relative">
              <img id="main-gallery-viewframe" src="${primaryImage}" alt="${product.name}" class="w-full h-full object-cover transition duration-200" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" />
              <div class="hidden absolute inset-0 flex items-center justify-center bg-slate-100 p-4 text-center">
                <span class="text-xs font-semibold text-slate-400">Missing Image Container Context</span>
              </div>
            </div>
            
            <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-thin">
              ${thumbnailsHTML}
            </div>
          </div>

          <div class="flex flex-col justify-between h-full">
            <div>
              <div class="mb-4 flex items-center gap-3">
                <span class="text-xs font-bold text-white bg-slate-900 px-2.5 py-1 rounded-lg uppercase tracking-wide">In Stock</span>
                <span class="text-xs font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg uppercase tracking-wide">${product.color}</span>
              </div>
              <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight leading-tight mb-4">${product.name}</h1>
              <p class="text-slate-600 text-sm leading-relaxed mb-6">${product.description}</p>
            </div>

            <div class="border-t border-slate-100 pt-6 mt-6">
              <div class="flex items-center justify-between gap-6 mb-4">
                <div>
                  <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Price</span>
                  <span class="text-2xl font-black text-slate-900">Rs.${product.price.toFixed(0)}</span>
                </div>
              </div>
              <div class="flex gap-4">
                <a href="index.html" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-center font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition">Catalog</a>
                <button onclick="addToCart('${product.id}')" class="w-2/3 bg-[#2bc4c3] hover:bg-[#229e9d] text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition shadow-sm text-center">Add To Cart 🎒</button>
              </div>
            </div>
          </div>
        `;

        // Bind events cleanly without using string attributes
        document.querySelectorAll(".thumb-nav-btn").forEach((btn) => {
          btn.addEventListener("click", function () {
            const targetSrc = this.getAttribute("data-img-target");
            switchMainDisplayImage(targetSrc);
          });
        });
      });

      function switchMainDisplayImage(targetSrcPath) {
        const viewFrame = document.getElementById("main-gallery-viewframe");
        if (!viewFrame) return;
        viewFrame.style.opacity = 0;
        setTimeout(() => {
          viewFrame.src = targetSrcPath;
          viewFrame.style.display = "block";
          const brokenStateNotice = viewFrame.nextElementSibling;
          if (brokenStateNotice) brokenStateNotice.classList.add("hidden");
          viewFrame.style.opacity = 1;
        }, 150);
      }
    </script>
  </body>
</html>
